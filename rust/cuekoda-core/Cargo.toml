[package]
name = "cuekoda-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
lofty = "0.25.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

tempfile = "3"
