[package]
name = "cuekoda-tauri"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = "2"

[dependencies]
cuekoda-core = { path = "../cuekoda-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-dialog = "2"
