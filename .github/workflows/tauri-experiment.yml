name: CueKoda Tauri experiment
on:
  push:
    branches: [experiment/tauri]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: node experiments/tauri/build.mjs
      - run: rustup update stable
      - run: cargo +stable fmt --manifest-path rust/cuekoda-tauri/Cargo.toml --check
      - run: cargo +stable build --release --locked --manifest-path rust/cuekoda-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cuekoda-tauri-${{ matrix.os }}
          path: |
            rust/cuekoda-tauri/target/release/cuekoda-tauri
            rust/cuekoda-tauri/target/release/cuekoda-tauri.exe
          if-no-files-found: error
